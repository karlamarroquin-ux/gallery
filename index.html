<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Galería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     CONFIGURACIÓN VISUAL — puedes ajustar estos valores
     ========================================================= */
  :root{
    --bg:#faf7f1;
    --bg-soft:#f2ece0;
    --card:#ffffff;
    --ink:#2c2620;
    --ink-dim:#948a7a;
    --accent:#b8892f;
    --accent-soft:#b8892f26;
    --line:#e8e0d2;
    --radius:14px;
    --font-display:'Playfair Display', serif;
    --font-body:'Inter', sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
    overflow-x:hidden;
  }

  @keyframes fadeSlideUp{
    from{opacity:0; transform:translateY(14px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @keyframes shimmer{
    0%{background-position:-300px 0;}
    100%{background-position:300px 0;}
  }
  @keyframes popIn{
    from{opacity:0; transform:scale(.9);}
    to{opacity:1; transform:scale(1);}
  }
  @keyframes titleIn{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:28px 18px 60px;
  }

  /* ---------- Encabezado ---------- */
  header.top{
    text-align:center;
    margin-bottom:26px;
  }
  header.top .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  header.top h1{
    font-family:var(--font-display);
    font-size:clamp(26px,6vw,40px);
    margin:0;
    font-weight:700;
    letter-spacing:.01em;
  }
  header.top p{
    color:var(--ink-dim);
    font-size:14px;
    margin:10px 0 0;
  }

  /* ---------- Botón Volver ---------- */
  .back-btn{
    display:none;
    align-items:center;
    gap:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    margin:0 auto 22px;
    transition:border-color .2s ease, background .2s ease;
  }
  .back-btn.show{display:inline-flex; animation:fadeSlideUp .35s ease both;}
  .back-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .back-btn:active{transform:scale(.94);}
  .back-btn svg{width:14px;height:14px;stroke:currentColor;transition:transform .25s ease;}
  .back-btn:active svg{transform:translateX(-3px);}

  /* ---------- Botones de categoría ---------- */
  nav.categories{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:32px;
  }
  .cat-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--font-body);
    padding:18px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    min-width:108px;
    flex:1 1 108px;
    max-width:150px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    animation:fadeSlideUp .4s ease both;
    box-shadow:0 1px 4px rgba(60,50,30,.06);
  }
  .cat-btn .lbl{font-size:14.5px;font-weight:600;letter-spacing:.01em;}
  .cat-btn .cnt{font-size:11px;color:var(--ink-dim);}
  .cat-btn:hover{transform:translateY(-3px);border-color:var(--accent);}
  .cat-btn:active{transform:scale(.93);}
  .cat-btn.active{
    background:linear-gradient(180deg, var(--accent-soft), transparent);
    border-color:var(--accent);
    box-shadow:0 4px 18px var(--accent-soft);
  }
  .cat-btn.active .lbl{color:var(--accent);}

  /* En vista "galería" los botones de categoría se compactan en una barra horizontal deslizable */
  nav.categories.compact{
    flex-wrap:nowrap;
    overflow-x:auto;
    justify-content:flex-start;
    padding:6px 4px 10px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    position:sticky;
    top:0;
    z-index:20;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    scroll-snap-type:x proximity;
  }
  nav.categories.compact .cat-btn{
    flex-direction:row;
    min-width:auto;
    max-width:none;
    padding:9px 16px;
    border-radius:999px;
    flex:0 0 auto;
    scroll-snap-align:start;
    animation:none;
  }
  nav.categories.compact .cat-btn .cnt{display:none;}
  nav.categories.compact .cat-btn:active{transform:scale(.92);}

  /* ---------- Estado vacío ---------- */
  .empty-state{
    text-align:center;
    color:var(--ink-dim);
    font-size:14px;
    padding:30px 10px 10px;
  }

  /* ---------- Título de categoría activa ---------- */
  .cat-title{
    display:none;
    font-family:var(--font-display);
    font-size:clamp(20px,4vw,28px);
    text-align:center;
    margin:0 0 20px;
  }
  .cat-title.show{display:block; animation:titleIn .4s ease both;}

  /* ---------- Grilla de imágenes ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  @media (min-width:600px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px;}
  }
  .grid figure{
    margin:0;
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:10px;
    background:linear-gradient(90deg, var(--bg-soft) 0%, #e6ddc9 50%, var(--bg-soft) 100%);
    background-size:600px 100%;
    animation:shimmer 1.6s linear infinite, fadeSlideUp .5s ease both;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, box-shadow .2s ease;
    box-shadow:0 1px 4px rgba(60,50,30,.08);
  }
  .grid img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .4s ease, opacity .35s ease;
    opacity:0;
  }
  .grid img.loaded{opacity:1;}
  .grid figure:has(img.loaded){animation:fadeSlideUp .5s ease both; background:var(--card);}
  .grid figure:hover img{transform:scale(1.06);}
  .grid figure:hover{box-shadow:0 6px 18px rgba(60,50,30,.14);}
  .grid figure:active{transform:scale(.96);}
  .grid figure::after{
    content:'';
    position:absolute;inset:0;
    box-shadow:inset 0 0 0 1px rgba(60,50,30,.08);
    border-radius:10px;
    pointer-events:none;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;
    background:#0a0a0aee;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:16px;
    opacity:0;
    transition:opacity .25s ease;
  }
  .lightbox.open{display:flex; opacity:1;}
  .lightbox img{
    max-width:100%;
    max-height:82vh;
    border-radius:8px;
    box-shadow:0 20px 60px #000a;
    animation:popIn .3s cubic-bezier(.2,.8,.3,1) both;
    touch-action:pan-y;
  }
  .lightbox .lb-close,
  .lightbox .lb-nav{
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .lightbox .lb-close:active,
  .lightbox .lb-nav:active{transform:scale(.85); background:#ffffff1a;}
  .lightbox .lb-close{
    position:absolute;
    top:16px;right:16px;
    background:none;border:1px solid #ffffff33;
    color:#fff;width:38px;height:38px;border-radius:50%;
    font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox .lb-nav{
    position:absolute;
    top:50%;transform:translateY(-50%);
    background:none;border:1px solid #ffffff33;
    color:#fff;width:42px;height:42px;border-radius:50%;
    font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox .lb-nav:active{transform:translateY(-50%) scale(.85);}
  .lb-prev{left:12px;}
  .lb-next{right:12px;}
  .lightbox .lb-caption{
    position:absolute;
    bottom:18px;left:0;right:0;
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
    animation:fadeSlideUp .4s ease .1s both;
  }

  @media (max-width:480px){
    .lb-nav{width:36px;height:36px;font-size:16px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">Galería</p>
    <h1 id="mainTitle">Nuestro trabajo</h1>
    <p id="mainSubtitle">Elige una categoría para ver las fotografías</p>
  </header>

  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Volver a categorías
  </button>

  <nav class="categories" id="catNav"></nav>

  <h2 class="cat-title" id="catTitle"></h2>

  <p class="empty-state" id="emptyState">Selecciona una de las categorías de arriba para comenzar.</p>

  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
/* =========================================================
   1) DATOS DE LA GALERÍA — numeración automática
   ---------------------------------------------------------
   Ya NO escribes el nombre de cada foto. Solo indicas:
     - folder: la carpeta dentro de "img/" donde están las fotos
     - count:  cuántas fotos hay en esa carpeta
     - ext:    la extensión de archivo ('jpg', 'jpeg', 'png', 'webp')

   Tus fotos deben nombrarse 1, 2, 3... hasta "count", con la
   extensión indicada. Ejemplo para "retratos" con count:6 y
   ext:'jpg', GitHub debe tener:
     img/retratos/1.jpg
     img/retratos/2.jpg
     ... hasta ...
     img/retratos/6.jpg

   Si una foto falta o el número no coincide, esa miniatura
   simplemente se oculta sola (no rompe la galería).
   ========================================================= */
  const CATEGORIES = [
    { id: 'sv',     icon: '📷',  label: 'Colegio Eucarístico del Divino Salvador',     folder: 'sv',     count: 10, ext: 'jpg' },
    { id: 'ss',     icon: '🏞️', label: 'Colegio Eucarístico',     folder: 'ss',     count: 10, ext: 'jpg' },
    { id: 'cem',      icon: '🎉',  label: 'Colegio Eucarístico Mercedario',      folder: 'cem',      count: 10, ext: 'jpg' },
    { id: 'aca',     icon: '📦',  label: 'Liceo de Acajutla',     folder: 'aca',     count: 10, ext: 'jpg' },
    { id: 'cemt', icon: '🏛️', label: 'Colegio Eucarístico María Teresa', folder: 'cemt', count: 10, ext: 'jpg' }
  ];

  // Construye automáticamente la lista de imágenes de cada categoría
  // a partir de folder + count + ext (numeración 1..count).
  CATEGORIES.forEach(cat => {
    cat.images = [];
    for (let i = 1; i <= cat.count; i++) {
      cat.images.push({
        src: `img/${cat.folder}/${i}.${cat.ext}`,
        alt: `${cat.label} ${i}`
      });
    }
  });

/* ========================================================= */

  const catNav      = document.getElementById('catNav');
  const grid         = document.getElementById('grid');
  const backBtn       = document.getElementById('backBtn');
  const catTitle      = document.getElementById('catTitle');
  const emptyState    = document.getElementById('emptyState');
  const mainSubtitle  = document.getElementById('mainSubtitle');

  const lightbox   = document.getElementById('lightbox');
  const lbImg      = document.getElementById('lbImg');
  const lbCaption  = document.getElementById('lbCaption');
  const lbClose    = document.getElementById('lbClose');
  const lbPrev     = document.getElementById('lbPrev');
  const lbNext     = document.getElementById('lbNext');

  let activeCategory = null;
  let currentImages = [];
  let currentIndex = 0;

  function renderCategoryButtons(){
    catNav.innerHTML = '';
    CATEGORIES.forEach((cat, i) => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (activeCategory === cat.id ? ' active' : '');
      btn.setAttribute('data-cat', cat.id);
      btn.style.animationDelay = (i * 0.05) + 's';
      btn.innerHTML = `
        <span class="lbl">${cat.label}</span>
        <span class="cnt">${cat.images.length} fotos</span>
      `;
      btn.addEventListener('click', () => selectCategory(cat.id));
      catNav.appendChild(btn);
    });
  }

  function selectCategory(id){
    activeCategory = id;
    const cat = CATEGORIES.find(c => c.id === id);
    if(!cat) return;

    currentImages = cat.images;

    catTitle.textContent = cat.label;
    catTitle.classList.add('show');
    emptyState.style.display = 'none';
    backBtn.classList.add('show');
    catNav.classList.add('compact');
    mainSubtitle.textContent = 'Toca una imagen para ampliarla';

    renderCategoryButtons();
    renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goBack(){
    activeCategory = null;
    catTitle.classList.remove('show');
    emptyState.style.display = 'block';
    backBtn.classList.remove('show');
    catNav.classList.remove('compact');
    mainSubtitle.textContent = 'Elige una categoría para ver las fotografías';
    grid.innerHTML = '';
    renderCategoryButtons();
  }

  function renderGrid(){
    grid.innerHTML = '';
    currentImages.forEach((imgData, index) => {
      const figure = document.createElement('figure');
      figure.style.animationDelay = Math.min(index * 0.045, 0.5) + 's';
      figure.innerHTML = `<img src="${imgData.src}" alt="${imgData.alt}" loading="lazy">`;
      figure.addEventListener('click', () => openLightbox(index));
      grid.appendChild(figure);
    });
    grid.querySelectorAll('img').forEach(img => {
      img.addEventListener('load', () => img.classList.add('loaded'));
      img.addEventListener('error', () => {
        // La foto numerada no existe todavía en GitHub: ocultamos su casilla
        // en vez de mostrar el ícono de imagen rota.
        img.closest('figure').style.display = 'none';
      });
      if(img.complete && img.naturalWidth > 0) img.classList.add('loaded');
    });
  }

  function openLightbox(index){
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('open');
  }

  function updateLightbox(){
    const imgData = currentImages[currentIndex];
    lbImg.style.transition = 'none';
    lbImg.style.transform = 'translateX(0) rotate(0deg)';
    lbImg.style.opacity = 1;
    lbImg.style.animation = 'none';
    void lbImg.offsetWidth; // reinicia la animación
    lbImg.style.animation = 'popIn .3s cubic-bezier(.2,.8,.3,1) both';
    lbImg.src = imgData.src;
    lbImg.alt = imgData.alt;
    lbCaption.textContent = `${imgData.alt}  ·  ${currentIndex + 1} / ${currentImages.length}`;
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
  }

  function showNext(){
    currentIndex = (currentIndex + 1) % currentImages.length;
    updateLightbox();
  }
  function showPrev(){
    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
    updateLightbox();
  }

  backBtn.addEventListener('click', goBack);
  lbClose.addEventListener('click', closeLightbox);
  lbNext.addEventListener('click', showNext);
  lbPrev.addEventListener('click', showPrev);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') showNext();
    if(e.key === 'ArrowLeft') showPrev();
  });

  // Deslizar con el dedo en móvil dentro del lightbox, con arrastre en vivo
  let touchStartX = 0;
  let touchCurrentX = 0;
  let dragging = false;

  lightbox.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].clientX;
    dragging = true;
    lbImg.style.transition = 'none';
  }, {passive:true});

  lightbox.addEventListener('touchmove', (e) => {
    if(!dragging) return;
    touchCurrentX = e.changedTouches[0].clientX - touchStartX;
    lbImg.style.transform = `translateX(${touchCurrentX}px) rotate(${touchCurrentX/40}deg)`;
    lbImg.style.opacity = 1 - Math.min(Math.abs(touchCurrentX)/400, .5);
  }, {passive:true});

  lightbox.addEventListener('touchend', (e) => {
    dragging = false;
    const diff = e.changedTouches[0].clientX - touchStartX;
    lbImg.style.transition = 'transform .3s ease, opacity .3s ease';
    lbImg.style.transform = 'translateX(0) rotate(0deg)';
    lbImg.style.opacity = 1;
    if(Math.abs(diff) > 50){ diff > 0 ? showPrev() : showNext(); }
  }, {passive:true});

  renderCategoryButtons();
</script>

</body>
</html>
